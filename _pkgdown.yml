url: https://LidaWangPSU.github.io/scHINT/
template:
  bootstrap: 5
  math-rendering: mathjax
  bslib:
    bg: "#ffffff"
    fg: "#222222"
    primary: "#0074d9"
    link-color: "#0074d9"
    link-hover-color: "#031634"
    base_font:
      google: {family: "Lora", wght: [400, 700], ital: [0, 1]}
    heading_font:
      google: {family: "Nunito", wght: [300, 400, 700, 800]}
    code_font:
      google: "Fira Mono"
    font-size-base: "1.02rem"
    navbar-light-color: "#222222"
    navbar-light-hover-color: "#0074d9"
    border-radius: "0.3rem"
navbar:
  bg: light
  structure:
    left: [intro, user_guide, tutorials, reference, news]
  components:
    user_guide:
      text: User guide
      menu:
        - text: Model
          href: articles/model.html
        - text: Users manual
          href: articles/users-manual.html
        - text: Input formats and outputs
          href: articles/inputs-outputs.html
        - text: Troubleshooting
          href: articles/troubleshooting.html
        - text: Performance
          href: articles/performance.html
    tutorials:
      text: Tutorials
      menu:
        - text: G×Cell-State
          href: articles/tutorial-cell-state.html
        - text: G×Cell-Type (pseudobulk)
          href: articles/tutorial-cell-type.html
        - text: Perturbation
          href: articles/tutorial-perturbation.html
        - text: Genome-wide workflow
          href: articles/tutorial-workflow.html
        - text: Simulation and validation
          href: articles/simulation.html
reference:
  - title: Main models
    contents: [schint_cell, schint_sample, schint_pert]
  - title: Genotypes and GRMs
    contents: [make_grm, split_snps, read_plink, select_cis_snps, read_grm_bin]
  - title: Simulation and example data
    contents: [simulate_geno, simulate_schint, simulate_pert, schint_example, schint_pert_example]
